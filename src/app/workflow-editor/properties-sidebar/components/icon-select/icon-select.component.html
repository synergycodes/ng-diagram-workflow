<button
  class="trigger p10"
  type="button"
  [id]="controlId()"
  [disabled]="disabled()"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="listbox"
  (click)="toggle()"
  (keydown.escape)="close()"
>
  @if (selected(); as option) {
    @if (option.icon) {
      <app-node-icon class="option-icon" [icon]="option.icon" />
    }
    <span class="text">{{ option.label }}</span>
  } @else {
    <span class="text placeholder">{{ placeholder() }}</span>
  }
  <i class="ph ph-caret-down caret" [class.open]="isOpen()" aria-hidden="true"></i>
</button>

@if (isOpen()) {
  <!-- Presentational click-outside catcher; keyboard users dismiss via Escape. -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="backdrop" (click)="close()"></div>
  <div class="menu" role="listbox">
    @for (option of options(); track option.value) {
      <button
        class="option p10"
        type="button"
        role="option"
        [class.active]="option.value === value()"
        [attr.aria-selected]="option.value === value()"
        (click)="choose(option)"
        (keydown.escape)="close()"
      >
        @if (option.icon) {
          <app-node-icon class="option-icon" [icon]="option.icon" />
        }
        <span class="text">{{ option.label }}</span>
      </button>
    }
  </div>
}
