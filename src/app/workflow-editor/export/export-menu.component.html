<button class="export-button h10" type="button" (click)="toggle()" [attr.aria-expanded]="isOpen()">
  <app-node-icon class="icon" icon="mask:export" />
  Export
  <app-node-icon class="icon caret" icon="mask:caret-down" [class.open]="isOpen()" />
</button>

@if (isOpen()) {
  <!-- Presentational click-outside catcher; keyboard users dismiss via Escape/blur. -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <div class="backdrop" (click)="close()"></div>
  <div class="menu" role="menu">
    <button class="item p10" type="button" role="menuitem" (click)="exportJpeg()">
      <app-node-icon class="icon" icon="mask:image" />
      Export as JPEG
    </button>
    <button class="item p10" type="button" role="menuitem" (click)="exportJson()">
      <app-node-icon class="icon" icon="mask:braces" />
      Export as JSON
    </button>
  </div>
}
