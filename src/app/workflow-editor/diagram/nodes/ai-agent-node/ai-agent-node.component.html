<div class="card" ngDiagramNodeSelected [node]="node()">
  <app-node-status />
  <app-node-header
    [variant]="def().variant"
    [icon]="def().icon"
    [label]="data().label"
    [description]="data().description"
  >
  </app-node-header>

  @for (section of sections(); track section.key) {
    <section class="section">
      <h4 class="h10 section-title">{{ section.title }}</h4>
      @if (section.option; as option) {
        <div class="item p11">
          @if (option.icon) {
            <app-node-icon class="item-icon" [icon]="option.icon" />
          }
          <span class="item-label">{{ option.label }}</span>
        </div>
      } @else {
        <div class="item placeholder p11">
          <i class="ph ph-plus-circle" aria-hidden="true"></i>
          <span class="item-label">{{ section.placeholder }}</span>
        </div>
      }
    </section>
  }
</div>

<div class="header-ports">
  <ng-diagram-port [id]="portIn" type="target" side="left" />
  <ng-diagram-port [id]="portOut" type="source" side="right" />
</div>
